name: posters
on:
  push:
    paths: ['site/*.mp4']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make missing posters
        run: |
          mkdir -p site/posters
          for f in site/*.mp4; do
            b=$(basename "$f" .mp4)
            [ -f "site/posters/$b.jpg" ] || ffmpeg -loglevel error -y -ss 0.5 -i "$f" -frames:v 1 -vf "scale=360:-2" -q:v 6 "site/posters/$b.jpg"
          done
      - name: Commit
        run: |
          git config user.name "posters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/posters
          git diff --cached --quiet || (git commit -m "posters: auto" && git push)
