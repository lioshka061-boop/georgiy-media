<script>
/* AVI: піксель — тільки справжні події (фільтр тестів, без дублів, Lead з кроку «телефон») */
(function () {
  'use strict';
  if (window.__aviPixelGuard) return;
  window.__aviPixelGuard = true;

  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ?avi_internal=1 — позначити цей браузер як «свій» (його події не йдуть у Meta/Google); ?avi_internal=0 — зняти
  try {
    var m = location.search.match(/[?&]avi_internal=(0|1)/);
    if (m) { if (m[1] === '1') LS.set('avi_internal', '1'); else LS.del('avi_internal'); }
  } catch (e) {}

  function internal() {
    return LS.get('avi_internal') === '1' || LS.get('avz_test') === '1' || /[?&]avz_test=1/.test(location.search);
  }
  var DEBUG = /[?&]avi_pixel_debug=1/.test(location.search) || LS.get('avi_pixel_debug') === '1';
  function log() { if (DEBUG && window.console) console.log.apply(console, ['[AVI pixel]'].concat([].slice.call(arguments))); }

  function seen(key, ttlMs) {
    var map = {};
    try { map = JSON.parse(LS.get('avi_px_seen') || '{}') || {}; } catch (e) { map = {}; }
    var now = Date.now();
    for (var k in map) if (now - map[k] > 24 * 36e5) delete map[k];
    var dup = !!(map[key] && now - map[key] < ttlMs);
    if (!dup) { map[key] = now; LS.set('avi_px_seen', JSON.stringify(map)); }
    return dup;
  }

  function contentKey(p) {
    try {
      if (p && p.contents) return p.contents.map(function (c) { return c.id + 'x' + c.quantity; }).sort().join(',');
      if (p && p.content_ids) return [].concat(p.content_ids).sort().join(',');
    } catch (e) {}
    return '';
  }

  // false — подію відкидаємо
  function allow(a) {
    var type = a[0], name = a[1], p = a[2] || {};
    if (type !== 'track' && type !== 'trackCustom') return true;          // init, consent тощо
    if (internal()) { log('drop (internal)', name); return false; }
    if (type !== 'track') return true;
    if (name === 'AddToCart' && seen('atc:' + contentKey(p), 10 * 60e3)) { log('drop dup AddToCart'); return false; }
    if (name === 'InitiateCheckout' && seen('ic', 30 * 60e3)) { log('drop dup InitiateCheckout'); return false; }
    if (name === 'Purchase' && seen('pur:' + (p.value || '') + ':' + contentKey(p), 6 * 36e5)) { log('drop dup Purchase'); return false; }
    if (name === 'Lead' && seen('lead', 6 * 36e5)) { log('drop dup Lead'); return false; }
    return true;
  }

  var f = null, sendRaw = null;

  // крок 1 оформлення (ввів телефон) → стандартна подія Lead
  function after(a) {
    if (a[0] === 'trackCustom' && a[1] === 'generate_lead') {
      var p = a[2] || {};
      var lead = ['track', 'Lead', { value: p.value || 0, currency: p.currency || 'UAH', content_category: 'checkout_phone' }];
      if (allow(lead)) { log('Lead (checkout phone)', lead[2]); sendRaw(lead); }
    }
  }

  function wrap(fn) {
    var w = function () {
      var a = [].slice.call(arguments);
      if (!allow(a)) return;
      log('send', a[0], a[1], a[2] || '');
      var r = fn.apply(this, a);
      try { after(a); } catch (e) {}
      return r;
    };
    w.__avi = true;
    return w;
  }

  function install() {
    f = window.fbq;
    if (!f) return false;
    if (f.__aviWrapped) return true;
    f.__aviWrapped = true;

    var q = f.queue, qpush = q && q.push ? q.push : null;
    var realCM = f.callMethod || null;

    sendRaw = function (a) {
      if (realCM) return realCM.apply(f, a);
      if (qpush) return qpush.call(q, a);
    };

    // поки fbevents.js не завантажився — виклики йдуть у чергу
    if (qpush) {
      q.push = function (args) {
        var a = [].slice.call(args);
        if (!allow(a)) return q.length;
        var r = qpush.call(q, args);
        try { after(a); } catch (e) {}
        return r;
      };
    }
    // після завантаження — через callMethod
    if (realCM) {
      f.callMethod = wrap(realCM);
    } else {
      var cur;
      try {
        Object.defineProperty(f, 'callMethod', {
          configurable: true,
          get: function () { return cur; },
          set: function (v) { realCM = v && v.__avi ? realCM : v; cur = v && !v.__avi ? wrap(v) : v; }
        });
      } catch (e) {}
    }
    log('installed', internal() ? '— цей браузер позначено як свій, події не відправляються' : '');
    return true;
  }

  if (!install()) {
    var n = 0, iv = setInterval(function () { if (install() || ++n > 40) clearInterval(iv); }, 250);
  }

  // Google Ads / GA4: тести не рахуємо як конверсії
  if (internal()) {
    var gi = 0, gv = setInterval(function () {
      if (window.gtag && !window.gtag.__avi) {
        var g = window.gtag;
        window.gtag = function () {
          var a = arguments;
          if (a[0] === 'event' && /^(purchase|add_to_cart|begin_checkout|conversion|generate_lead|add_shipping_info)$/.test(a[1])) return;
          return g.apply(this, a);
        };
        window.gtag.__avi = true;
        clearInterval(gv);
      } else if (++gi > 40) clearInterval(gv);
    }, 250);
  }
})();
</script>
