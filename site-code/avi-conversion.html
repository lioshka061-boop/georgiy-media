<!-- AVI SHOP: блок довіри, липка кнопка «Купити» (мобільна), новий вигляд чекауту -->
<script>
(function () {
  'use strict';
  if (window.__aviConv) return;
  window.__aviConv = true;

  /* ===== НАЛАШТУВАННЯ ===== */
  var TRUST = [
    { ico: 'shield', t: 'Гарантія 12 місяців', s: 'особисто від Георгія' },
    { ico: 'truck',  t: 'Доставка Новою Поштою', s: 'по всій Україні' },
    { ico: 'box',    t: 'Оригінал з Європи', s: 'нова техніка, не сірий імпорт' },
    { ico: 'back',   t: 'Обмін і повернення', s: '14 днів за законом' }
  ];
  /* ======================== */

  var ICO = {
    shield: '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3Z" fill="currentColor"/>',
    truck:  '<path d="M3 5h11v9H3V5Zm11 3h3.5L21 11.5V14h-7V8ZM6.5 18.5a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z" fill="currentColor"/>',
    box:    '<path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Zm0 2.2 6.5 3.3L12 10.8 5.5 7.5 12 4.2ZM5 9.1l6 3v7.4l-6-3V9.1Zm8 10.4v-7.4l6-3v7.4l-6 3Z" fill="currentColor"/>',
    back:   '<path d="M12 4a8 8 0 1 1-7.4 5H2l3.5-4L9 9H6.7A6 6 0 1 0 12 6V4Z" fill="currentColor"/>'
  };
  var svg = function (p) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; };
  var trustHtml = function (cls) {
    return '<div class="avt ' + (cls || '') + '">' + TRUST.map(function (x) {
      return '<div class="avt-i"><span class="avt-ico">' + svg(ICO[x.ico]) + '</span><span><b>' + x.t + '</b><small>' + x.s + '</small></span></div>';
    }).join('') + '</div>';
  };

  var css = '' +
    /* ---- блок довіри ---- */
    '.avt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px;font-family:Unbounded,Arial,Helvetica,sans-serif}' +
    '.avt-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:2px;background:#f7f7f5;color:#1a1a1a}' +
    '.avt-ico{flex:none;width:34px;height:34px;border-radius:2px;background:#F1C944;color:#1a1a1a;display:flex;align-items:center;justify-content:center}' +
    '.avt-ico svg{width:18px;height:18px}' +
    '.avt-i b{display:block;font-size:12px;font-weight:700;line-height:1.25}' +
    '.avt-i small{display:block;font-size:11px;opacity:.65;line-height:1.3}' +
    '.avt--aside{grid-template-columns:1fr;margin:14px 0 0;background:#fff;border-radius:12px;padding:8px 10px;gap:0;box-shadow:0 8px 30px rgba(0,0,0,.06)}' +
    '.avt--aside .avt-i{background:transparent}' +
    '.avt--aside .avt-i+.avt-i{border-top:1px solid #f0f0f0;border-radius:0}' +
    '@media (max-width:420px){.avt{grid-template-columns:1fr}}' +

    /* ---- липка кнопка «Купити» (мобільна) ---- */
    '#avs-bar{position:fixed;left:0;right:0;bottom:0;z-index:2147483500;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.12);font-family:Unbounded,Arial,Helvetica,sans-serif;transform:translateY(110%);transition:transform .2s}' +
    '#avs-bar.is-on{transform:none}' +
    '#avs-bar .avs-p{flex:1;min-width:0;line-height:1.2}' +
    '#avs-bar .avs-new{display:block;font-size:18px;font-weight:700;color:#e60000}' +
    '#avs-bar .avs-old{font-size:12px;color:#888;text-decoration:line-through}' +
    '#avs-bar .avs-btn{flex:none;height:48px;padding:0 26px;border:0;border-radius:2px;background:#1a1a1a;color:#fff;font:700 15px Unbounded,Arial,sans-serif;cursor:pointer}' +
    'body.avs-has-bar #avc-root{bottom:96px}' +
    '@media (prefers-reduced-motion:reduce){#avs-bar{transition:none}}' +

    /* ---- чекаут ---- */
    '.checkout{font-family:Unbounded,Arial,Helvetica,sans-serif}' +
    '.checkout .main-h{font-size:32px;margin-bottom:20px}' +
    '.checkout-header{margin-bottom:0 !important;border:0 !important;align-items:flex-end}' +
    '.checkout-tabs{display:flex !important;align-items:stretch;gap:4px;padding:0;background:none}' +
    '.checkout-tabs .checkout-tabs-i{display:flex !important;align-items:center;margin:0 !important;height:auto !important;border-radius:12px 12px 0 0 !important;padding:10px 16px !important;background:rgba(255,255,255,.45) !important;box-shadow:none !important;font-size:13px;line-height:1.2;color:#1a1a1a !important}' +
    '.checkout-tabs .checkout-tabs-i.__active{background:#fff !important}' +
    '.checkout-body{border-radius:0 12px 12px 12px !important;padding:8px 28px 28px !important}' +
    '#checkout-container{counter-reset:avstep}' +
    '#checkout-container > .checkout-step{position:relative;padding:22px 0 22px 48px !important;border-bottom:1px solid #eee}' +
    '#checkout-container > .checkout-step::before{counter-increment:avstep;content:counter(avstep);position:absolute;left:0;top:20px;width:32px;height:32px;border-radius:2px;background:#F1C944;color:#1a1a1a;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}' +
    '#checkout-container > .checkout-step.__disabled{opacity:.55}' +
    '#checkout-container > .checkout-step.__disabled::before{background:#e8e8e8}' +
    '.checkout .checkout-step-h{font-size:18px !important;font-weight:700 !important;color:#1a1a1a !important;margin:4px 0 14px}' +
    '.checkout .form-head label{font-size:13px;font-weight:600;color:#555}' +
    '.checkout .field,.checkout .selectboxit-btn{height:48px !important;border:1px solid #cfcfcf !important;border-radius:2px !important;font-size:15px !important;padding:0 14px !important;transition:border-color .15s,box-shadow .15s}' +
    '.checkout .selectboxit-btn{display:flex !important;align-items:center}' +
    '.checkout .field:focus,.checkout .selectboxit-btn:focus,.checkout .selectboxit-btn.selectboxit-focus{border-color:#1a1a1a !important;box-shadow:0 0 0 2px #F1C944 !important;outline:none}' +
    '.checkout textarea.field{height:96px !important;padding:12px 14px !important}' +
    '.checkout-footer{padding-top:22px !important}' +
    '.checkout-footer .btn.j-submit{display:flex !important;align-items:center;justify-content:center;width:100%;max-width:420px;height:54px !important;border-radius:2px !important;background:#1a1a1a !important;color:#fff !important;font:700 17px Unbounded,Arial,sans-serif !important;border:0 !important;box-shadow:none}' +
    '.checkout-footer .btn.j-submit:hover{background:#000 !important}' +
    '.checkout-footer .btn.j-submit.__disabled{opacity:.7;box-shadow:none}' +
    '.checkout-aside .order{border-radius:12px !important;padding:22px !important}' +
    '.checkout-aside{position:sticky;top:20px;align-self:flex-start}' +
    '.checkout-aside .order-header{font-size:18px;font-weight:700}' +
    '.checkout-aside .order-summary{border-top:1px dashed #ddd;padding-top:14px;margin-top:10px}' +
    '.checkout-aside .order-summary-b{font-size:24px !important;font-weight:800 !important}';
  var st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  var insertAfter = function (el, ref) { ref.parentNode.insertBefore(el, ref.nextSibling); };
  var mk = function (html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; };

  /* ---------- Сторінка товару ---------- */
  var isMobile = !!document.querySelector('.product-card--main');
  var hasProduct = !!document.querySelector('meta[itemprop="sku"]');
  if (hasProduct) {
    var anchor = isMobile
      ? (function () { var f = document.querySelector('.product__block--orderBox .j-widget-favorites-add'); return f && f.closest('.btn-toolbar'); })()
      : document.querySelector('.product__section--order');
    if (anchor && !document.querySelector('.avt')) insertAfter(mk(trustHtml()), anchor);

    if (isMobile) {
      var card = document.querySelector('.product-card--main');
      var box = card.querySelector('.product-card__order-box') || card;
      /* видима головна кнопка: «Купити» або «В кошику», якщо товар уже доданий */
      var primary = function () {
        return [].filter.call(box.querySelectorAll('.j-buy-button-add, .btn--primary'), function (b) {
          return b.offsetParent !== null && !b.classList.contains('j-submit');
        })[0];
      };
      var newP = card.querySelector('.product-card__price--new');
      var oldP = card.querySelector('.product-card__old-price');
      if (primary() && newP) {
        var bar = mk('<div id="avs-bar" role="region" aria-label="Купити"><div class="avs-p"><span class="avs-new"></span>' +
          '<span class="avs-old"></span></div><button type="button" class="avs-btn">Купити</button></div>');
        var barBtn = bar.querySelector('.avs-btn');
        bar.querySelector('.avs-new').textContent = newP.textContent.trim();
        if (oldP && oldP.textContent.trim()) bar.querySelector('.avs-old').textContent = oldP.textContent.trim();
        document.body.appendChild(bar);
        barBtn.addEventListener('click', function () { var b = primary(); if (b) b.click(); });
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (e) {
            var show = !e[0].isIntersecting && e[0].boundingClientRect.top < 0;
            if (show) { var b = primary(); barBtn.textContent = (b && b.textContent.trim()) || 'Купити'; }
            bar.classList.toggle('is-on', show);
            document.body.classList.toggle('avs-has-bar', show);
          }).observe(box);
        }
      }
    }
  }

  /* ---------- Чекаут ---------- */
  var order = document.querySelector('.checkout-aside .order');
  if (order && !document.querySelector('.avt--aside')) insertAfter(mk(trustHtml('avt--aside')), order);

  /* мобільний чекаут (окремий шаблон Хорошопа) */
  if (document.querySelector('.checkout .tabs--boxed')) {
    document.body.classList.add('avm-co');
    var mcss = '' +
      'body.avm-co{background:#F1C944 !important}' +
      '.avm-co .auth{background:transparent}' +
      '.avm-co .checkout .tabs__nav{background:rgba(255,255,255,.45);border-radius:2px;padding:3px;margin:0 0 12px;border:0}' +
      '.avm-co .checkout .tabs__item{border-radius:2px;border:0 !important;font-weight:600}' +
      '.avm-co .checkout .tabs__item.is-active{background:#fff}' +
      '.avm-co .checkout .tabs__nav-wrap{display:flex;width:100%}' +
      '.avm-co .checkout .tabs__item{flex:1;display:flex;justify-content:center;text-align:center;padding:10px 6px;font-size:13px}' +
      '.avm-co .checkout .tabs__item::after,.avm-co .checkout .tabs__nav::after{display:none !important}' +
      '.avm-co .checkout form{counter-reset:avstep}' +
      '.avm-co .checkout .form__section.j-component{background:#fff;border-radius:12px;padding:18px 16px;margin:0 0 12px}' +
      '.avm-co .checkout .form__section.j-component .form__head:first-child{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}' +
      '.avm-co .checkout .form__section.j-component .form__head:first-child::before{counter-increment:avstep;content:counter(avstep);flex:none;width:28px;height:28px;border-radius:2px;background:#F1C944;color:#1a1a1a;font-size:14px;display:flex;align-items:center;justify-content:center}' +
      '.avm-co .checkout .form__section.is-disabled{opacity:.6}' +
      '.avm-co .checkout .input,.avm-co .checkout .select__control,.avm-co .checkout textarea{border:1px solid #cfcfcf !important;border-radius:2px !important;background:#fff !important}' +
      '.avm-co .checkout .input:focus,.avm-co .checkout .select__control:focus,.avm-co .checkout textarea:focus{border-color:#1a1a1a !important;box-shadow:0 0 0 2px #F1C944;outline:none}' +
      '.avm-co .checkout .form__section--column{background:#fff;border-radius:12px;padding:16px;margin:0 0 12px}' +
      '.avm-co .checkout .j-submit{height:54px;border-radius:2px !important;background:#1a1a1a !important;color:#fff !important;font-weight:700;font-size:16px;border:0 !important}' +
      '.avm-co .checkout .j-submit.is-disabled,.avm-co .checkout .j-submit[disabled]{opacity:.7}' +
      '.avm-co .order-details{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:12px}' +
      '.avm-co .order-details__total{font-size:22px;font-weight:800}' +
      '.avm-co .avt--aside{margin:0 0 16px}';
    var ms = document.createElement('style');
    ms.textContent = mcss;
    document.head.appendChild(ms);
    var od = document.querySelector('.order-details');
    if (od && !document.querySelector('.avt--aside')) insertAfter(mk(trustHtml('avt--aside')), od);
  }
})();
</script>
