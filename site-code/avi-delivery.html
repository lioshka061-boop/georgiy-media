<!-- AVI SHOP: блок «Безкоштовна доставка» на сторінці товару -->
<script>
(function () {
  'use strict';
  if (window.__aviDelivery) return;
  window.__aviDelivery = true;
  if (!document.querySelector('meta[itemprop="sku"]')) return;

  var path = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var I = {
    truck: path('<path d="M2 6h11v9H2z"/><path d="M13 9h4l3 3.5V15h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'),
    clock: path('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    box: path('<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>'),
    eye: path('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>')
  };

  var css = '' +
    '.avd{box-sizing:border-box;font-family:Unbounded,Arial,Helvetica,sans-serif;color:#1a1a1a;background:#fff;border-radius:12px;padding:18px 20px;margin:16px 0 0}' +
    '.avd *{box-sizing:border-box}' +
    '.avd-top{display:flex;align-items:center;gap:12px}' +
    '.avd-ico{flex:none;width:44px;height:44px;border-radius:2px;background:#F1C944;color:#1a1a1a;display:flex;align-items:center;justify-content:center}' +
    '.avd-ico svg{width:24px;height:24px}' +
    '.avd-h{flex:1;min-width:0}' +
    '.avd-h b{display:block;font-size:16px;font-weight:800;line-height:1.2}' +
    '.avd-h small{display:block;margin-top:3px;font-size:12px;color:#6b6b6b;line-height:1.35}' +
    '.avd-tag{flex:none;padding:6px 10px;border-radius:2px;background:#e8f5ec;color:#1f8f4e;font-size:13px;font-weight:800;white-space:nowrap}' +
    '.avd-list{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px solid #f0f0f0;display:grid;gap:12px}' +
    '.avd-list li{display:flex;align-items:flex-start;gap:10px;margin:0;padding:0;font-size:12.5px;line-height:1.4;color:#444}' +
    '.avd-list li:before{display:none}' +
    '.avd-list i{flex:none;width:20px;height:20px;color:#1a1a1a;margin-top:1px}' +
    '.avd-list i svg{width:20px;height:20px}' +
    '.avd-list b{color:#1a1a1a;font-weight:700}' +
    '.avd--m{margin:12px 0 0;padding:14px;border:1px solid #ececec}' +
    '.avd--m .avd-ico{width:40px;height:40px}' +
    '.avd--m .avd-h b{font-size:15px}' +
    '.avd--m .avd-list{margin-top:12px;padding-top:12px;gap:10px}';
  var st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  var html = function (mob) {
    return '<div class="avd' + (mob ? ' avd--m' : '') + '">' +
      '<div class="avd-top"><span class="avd-ico">' + I.truck + '</span>' +
      '<div class="avd-h"><b>Безкоштовна доставка</b><small>по всій Україні Новою поштою</small></div>' +
      '<span class="avd-tag">0 грн</span></div>' +
      '<ul class="avd-list">' +
      '<li><i>' + I.clock + '</i><span><b>Відправка сьогодні</b> — якщо замовите в будні до 16:00</span></li>' +
      '<li><i>' + I.box + '</i><span><b>1–3 дні в дорозі</b> — у відділення, поштомат або кур’єром</span></li>' +
      '<li><i>' + I.eye + '</i><span><b>Огляд при отриманні</b> — оплата онлайн, при отриманні або частинами</span></li>' +
      '</ul></div>';
  };
  var mk = function (h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstChild; };

  /* текст вкладки «Доставка» з налаштувань Хорошопу — замінюємо на актуальний */
  var fixTab = function () {
    [].forEach.call(document.querySelectorAll('p, div'), function (el) {
      if (el.children.length > 2 || el.__avd) return;
      if (/^\s*Доставка\s*за тарифами Нової Пошти\.?\s*$/i.test(el.textContent)) {
        el.__avd = true;
        el.innerHTML = '<b>Безкоштовна доставка</b> Новою поштою по всій Україні — у відділення, поштомат або кур’єром. Замовлення в будні до 16:00 відправляємо в той же день.';
      }
    });
  };
  fixTab();
  setTimeout(fixTab, 1500);

  var place = function () {
    if (document.querySelector('.avd')) return true;
    var isMobile = !!document.querySelector('.product-card--main');
    /* на телефоні безкоштовна доставка — у зеленому рядку «Відправимо сьогодні» (avi-extras) */
    if (isMobile) return true;
    var col = document.querySelector('.j-product-left-column');
    if (!col) return false;
    col.appendChild(mk(html(false)));
    return true;
  };
  if (!place()) {
    var n = 0, t = setInterval(function () { if (place() || ++n > 20) clearInterval(t); }, 300);
  }
})();
</script>
