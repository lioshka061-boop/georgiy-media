<!-- AVI SHOP: плитка «96% позитивних відгуків · N на Prom.ua» у рядку довіри та перевагах — живі дані з віджета Prom, без переходу на Prom -->
<script>
(function () {
  'use strict';
  if (window.__aviProm) return;
  window.__aviProm = true;

  var STORES = [3820771, 3802720]; /* avishop.com.ua та O&P — один продавець, ФОП Пасічник */
  var KEY = 'avx_prom_v2', TTL = 6 * 3600 * 1000;

  var path = location.pathname.replace(/\/+$/, '');
  var isHome = path === '' || path === '/ua' || path === '/uk';
  var isProduct = !!document.querySelector('meta[itemprop="sku"]');
  if (!isHome && !isProduct && !/checkout|cart|basket/.test(path)) return;

  var plural = function (n) {
    var a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? 'відгук' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'відгуки' : 'відгуків';
  };
  var num = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };

  var load = function (id) {
    return fetch('https://prom.ua/renders/certification_widget/widget?widgetSize=740x180&widgetLanguage=uk&companyId=' + id)
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (h) {
        var m = h.match(/(\d{1,3})%\s*позитивних\s*з\s*(\d[\d\s]*)\s*відгук/);
        return m ? { pct: +m[1], cnt: +m[2].replace(/\s/g, '') } : null;
      })['catch'](function () { return null; });
  };
  var getData = function () {
    try {
      var c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (c && Date.now() - c.t < TTL && c.d) return Promise.resolve(c.d);
    } catch (e) {}
    return Promise.all(STORES.map(load)).then(function (list) {
      list = list.filter(Boolean);
      if (!list.length) return null;
      var cnt = list.reduce(function (s, x) { return s + x.cnt; }, 0);
      var d = { cnt: cnt, pct: Math.round(list.reduce(function (s, x) { return s + x.pct * x.cnt; }, 0) / cnt) };
      try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      return d;
    });
  };

  var star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17.1 6.4 20l1.1-6.2L2.9 9.4l6.3-.9L12 2.8Z" fill="currentColor"/></svg>';
  var starL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8L12 3.5Z"/></svg>';
  var t1 = function (d) { return d.pct + '% позитивних відгуків'; };
  var t2 = function (d) { return num(d.cnt) + ' ' + plural(d.cnt) + ' покупців на Prom.ua'; };

  var css = '' +
    /* товар: 4 плитки сіткою 2×2 */
    '.avt.avpr-on:not(.avt--aside){grid-template-columns:repeat(2,1fr) !important}' +
    '@media (max-width:420px){.avt.avpr-on:not(.avt--aside){grid-template-columns:1fr !important}}' +
    /* головна: 6 переваг */
    '@media (min-width:1101px){.avh-ben-list.avpr-on{grid-template-columns:repeat(6,1fr) !important;gap:12px !important}}';

  var place = function (d) {
    var done = false;
    /* рядок довіри на товарі + блоки в кошику/оформленні */
    [].forEach.call(document.querySelectorAll('.avt'), function (row) {
      done = true;
      if (row.querySelector('.avpr-i')) return;
      var el = document.createElement('div');
      el.className = 'avt-i avpr-i';
      el.innerHTML = '<span class="avt-ico">' + star + '</span><span><b>' + t1(d) + '</b><small>' + t2(d) + '</small></span>';
      row.appendChild(el);
      row.classList.add('avpr-on');
    });
    var ben = document.querySelector('.avh-ben-list');
    if (ben) {
      done = true;
      if (!ben.querySelector('.avpr-i')) {
        var li = document.createElement('li');
        li.className = 'avh-ben-i avpr-i';
        li.innerHTML = '<span class="avh-ben-ico">' + starL + '</span><span><b>' + t1(d) + '</b><small>' + t2(d) + '</small></span>';
        ben.appendChild(li);
        ben.classList.add('avpr-on');
      }
    }
    return done;
  };

  getData().then(function (d) {
    if (!d) return;
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
    place(d); var n = 0, t = setInterval(function () { place(d); if (++n > 20) clearInterval(t); }, 500);
  });
})();
</script>
